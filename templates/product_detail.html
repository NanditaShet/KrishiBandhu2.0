{%extends "base.html"%}{%block content%}<div class="card"><h1>{{product.name}}</h1><p>{{product.crop}} · ₹{{product.price_per_kg}}/kg · {{product.quantity_kg}} kg</p><p>Farmer: {{product.farmer.name}} · {{product.location}}</p><p>{{product.description or ''}}</p>{%if current_user.role=='customer'%}<form method="post" action="{{url_for('create_order',pid=product.id)}}"><label>Quantity (kg)</label><input name="quantity_kg" type="number" step=".01" max="{{product.quantity_kg}}" required><label>Delivery address</label><textarea name="delivery_address" required></textarea><button class="btn">Buy Now</button></form>{%endif%}</div>{%endblock%}
