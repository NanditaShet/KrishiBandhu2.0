{%extends "base.html"%}{%block content%}<div class="card"><h1>Market Prices</h1><p id="s">Checking configured official market-data source...</p><div id="d"></div></div><script>
(async()=>{let r=await fetch("{{url_for('api_market')}}"),x=await r.json();document.getElementById('s').textContent=x.verified?'Verified provider data returned.':x.message;document.getElementById('d').innerHTML=x.verified?'<pre>'+JSON.stringify(x.data,null,2)+'</pre>':'<p>No live price is shown until an official provider is configured.</p>'})();
</script>{%endblock%}
