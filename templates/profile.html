{%extends "base.html"%}{%block content%}<div class="auth card"><h1>My Profile</h1><form method="post"><label>Name</label><input name="name" value="{{current_user.name}}" required><label>Phone</label><input name="phone" value="{{current_user.phone or ''}}"><label>Location</label><input name="location" value="{{current_user.location or ''}}"><label>Language</label><select name="language"><option value="en" {%if current_user.language=='en'%}selected{%endif%}>English</option><option value="kn" {%if current_user.language=='kn'%}selected{%endif%}>ಕನ್ನಡ</option></select>
{%if current_user.role=='farmer'%}<label>Crop</label><input name="crop" value="{{farmer.crop if farmer else ''}}"><label>Farm size</label><input name="farm_size" value="{{farmer.farm_size if farmer else ''}}"><label>District</label><input name="district" value="{{farmer.district if farmer else ''}}"><label>State</label><input name="state" value="{{farmer.state if farmer else 'Karnataka'}}">
{%elif current_user.role=='expert'%}<label>Qualification</label><input name="qualification" value="{{expert.qualification if expert else ''}}"><label>Specialization</label><input name="specialization" value="{{expert.specialization if expert else ''}}"><label>Experience</label><input name="experience_years" type="number" value="{{expert.experience_years if expert else 0}}"><label>Online fee</label><input name="online_fee" type="number" value="{{expert.online_fee if expert else 0}}"><label>Field fee</label><input name="field_fee" type="number" value="{{expert.field_fee if expert else 0}}"><label>Availability</label><input name="availability" value="{{expert.availability if expert else ''}}"><label>Bio</label><textarea name="bio">{{expert.bio if expert else ''}}</textarea>
{%else%}<label>Address</label><textarea name="address">{{customer.address if customer else ''}}</textarea>{%endif%}<button class="btn">Save Profile</button></form></div>{%endblock%}
