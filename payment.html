{%extends "base.html"%}{%block content%}<div class="card"><h1>Secure Payment</h1><p>Order #{{order.id}} · ₹{{order.total_amount}}</p><button id="pay" class="btn">Pay with Razorpay</button></div><script src="https://checkout.razorpay.com/v1/checkout.js"></script><script>
document.getElementById('pay').onclick=()=>new Razorpay({key:"{{key_id}}",amount:{{(order.total_amount*100)|int}},currency:"INR",name:"KrishiBandhu",description:"Agricultural order",order_id:"{{order.payment_order_id}}",handler:async r=>{let x=await fetch("{{url_for('payment_verify')}}",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({order_id:{{order.id}},razorpay_order_id:r.razorpay_order_id,razorpay_payment_id:r.razorpay_payment_id,razorpay_signature:r.razorpay_signature})});let d=await x.json();location.href=d.ok?d.redirect:"{{url_for('orders')}}";}}).open();
</script>{%endblock%}
