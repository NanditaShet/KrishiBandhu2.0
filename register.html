{%extends "base.html"%}{%block content%}<div class="auth card"><h1>{{role.title()}} Registration</h1><form method="post"><label>Name</label><input name="name" required><label>Email</label><input name="email" type="email" required><label>Password</label><input name="password" type="password" minlength="6" required><label>Phone</label><input name="phone"><label>Location</label><input name="location"><label>Language</label><select name="language"><option value="en">English</option><option value="kn">ಕನ್ನಡ</option></select>
{%if role=='farmer'%}<label>Crop</label><input name="crop"><label>Farm size</label><input name="farm_size"><label>District</label><input name="district"><label>State</label><input name="state" value="Karnataka">
{%elif role=='expert'%}<label>Qualification</label><input name="qualification"><label>Specialization</label><input name="specialization"><label>Experience years</label><input name="experience_years" type="number"><label>Online fee</label><input name="online_fee" type="number"><label>On-field fee</label><input name="field_fee" type="number"><label>Availability</label><input name="availability"><label>Bio</label><textarea name="bio"></textarea>
{%else%}<label>Delivery address</label><textarea name="address" required></textarea>{%endif%}<button class="btn">Create Account</button></form></div>{%endblock%}
